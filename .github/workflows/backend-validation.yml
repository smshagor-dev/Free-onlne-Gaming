name: Backend validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Build frontend assets
        run: npm run build

      - name: Validate navigation search JavaScript syntax
        run: |
          sed '1d;$d' resources/views/layouts/menu-script.blade.php > /tmp/free-games-menu.js
          node --check /tmp/free-games-menu.js

      - name: Run PHP tests
        run: php artisan test

      - name: Validate routes
        run: php artisan route:list

      - name: Audit Composer dependencies
        run: composer audit

      - name: Audit npm dependencies
        run: npm audit

      - name: PHP lint
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

  production-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install development dependencies to seed provider caches
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Confirm Pail was discovered in development
        run: grep -q 'PailServiceProvider' bootstrap/cache/packages.php

      - name: Switch the same checkout to production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Verify Laravel boots without Pail
        run: |
          test -f bootstrap/cache/packages.php
          ! grep -q 'PailServiceProvider' bootstrap/cache/packages.php
          if test -f bootstrap/cache/services.php; then
            ! grep -q 'PailServiceProvider' bootstrap/cache/services.php
          fi
          php artisan list --raw > /dev/null
