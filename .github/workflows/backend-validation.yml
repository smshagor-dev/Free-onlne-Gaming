name: Backend validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure private env file is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '.env must never be committed'
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Build frontend assets
        run: npm run build

      - name: Run PHP tests
        run: php artisan test

      - name: Validate routes and scheduler
        run: |
          php artisan route:list
          php artisan schedule:list

      - name: Validate production configuration contract
        run: |
          APP_ENV=production \
          APP_DEBUG=false \
          APP_URL=https://example.test \
          SESSION_SECURE_COOKIE=true \
          SESSION_ENCRYPT=true \
          FORCE_HTTPS=true \
          TRUSTED_HOSTS='^example\.test$' \
          php artisan app:production-check

      - name: Validate production caches
        run: |
          php artisan config:cache
          php artisan view:cache
          php artisan optimize:clear

      - name: Audit Composer dependencies
        run: composer audit

      - name: Audit npm dependencies
        run: npm audit

      - name: PHP lint
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
